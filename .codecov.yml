# Codecov Configuration for AlgebraicHashing
# Comprehensive coverage reporting configuration

codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 95%
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 90%
        threshold: 5%
        if_ci_failed: error

comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

ignore:
  - "tests/"
  - "examples/"
  - "build/"
  - "cmake/"
  - "experimental/"